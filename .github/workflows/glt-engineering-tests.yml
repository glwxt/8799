name: GLT engineering unit tests
on:
  push:
    paths:
      - 'glt-global-liquidity-transmission/engineering/v0.2.0/**'
      - '.github/workflows/glt-engineering-tests.yml'
  pull_request:
    paths:
      - 'glt-global-liquidity-transmission/engineering/v0.2.0/**'
      - '.github/workflows/glt-engineering-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: glt-global-liquidity-transmission/engineering/v0.2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python src/glt.py --asof 2026-11-21T08:00:00+08:00
